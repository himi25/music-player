<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-800 text-white pt-32 min-h-screen">

  <!-- Navbar -->
  <nav class="fixed top-0 w-full z-50 bg-white/10 backdrop-blur-md shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-yellow-400 to-yellow-500 animate-pulse">
        🎵 Music Vibes
      </a>
      <ul class="flex gap-8 text-white font-medium">
        <li><a href="index.html" class="hover:text-yellow-300 transition">Home</a></li>
        <li><a href="albums.html" class="hover:text-yellow-300 transition">Albums</a></li>
        <li><a href="artists.html" class="hover:text-yellow-300 transition">Artists</a></li>
        <li><a href="contact.html" class="hover:text-yellow-300 transition">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- Contact Form -->
  <div class="flex flex-col items-center px-6">
    <h1 class="text-4xl font-bold text-yellow-400 mb-6">Contact Us</h1>
    <p class="text-gray-300 mb-8 text-center max-w-xl">
      Have a question, feedback, or just want to say hello? Fill out the form below and we’ll get back to you!
    </p>

    <form class="w-full max-w-md bg-white/10 p-6 rounded-xl shadow-lg backdrop-blur">
      <div class="mb-4">
        <label class="block text-sm text-gray-300 mb-2" for="name">Name</label>
        <input class="w-full p-2 rounded bg-gray-200 text-black" type="text" id="name" required>
      </div>
      <div class="mb-4">
        <label class="block text-sm text-gray-300 mb-2" for="email">Email</label>
        <input class="w-full p-2 rounded bg-gray-200 text-black" type="email" id="email" required>
      </div>
      <div class="mb-4">
        <label class="block text-sm text-gray-300 mb-2" for="message">Message</label>
        <textarea class="w-full p-2 rounded bg-gray-200 text-black" id="message" rows="4" required></textarea>
      </div>
      <button type="submit" class="bg-yellow-400 text-black font-semibold py-2 px-4 rounded hover:bg-yellow-500 transition">
        Send Message
      </button>
    </form>
  </div>

</body>
</html>
