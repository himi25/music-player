<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="script.js" defer></script>
</head>
<body>
 <!-- NAV BAR  -->
<nav class="fixed top-0 w-full z-50 bg-white/10 backdrop-blur-md shadow-lg">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    
    <!-- Brand Title -->
    <a href="index.html" class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-yellow-400 to-yellow-500 animate-pulse">
      🎵 Music Vibes
    </a>
    
    <!-- Menu Links -->
    <ul class="flex gap-8 text-white font-medium">
      <li>
        <a href="index.html" class="relative group">
          <span class="group-hover:text-yellow-300 transition duration-300">Home</span>
          <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-yellow-400 group-hover:w-full transition-all duration-300"></span>
        </a>
      </li>
      <li>
        <a href="albums.html" class="relative group">
          <span class="group-hover:text-yellow-300 transition duration-300">Albums</span>
          <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-yellow-400 group-hover:w-full transition-all duration-300"></span>
        </a>
      </li>
      <li>
        <a href="artists.html" class="relative group">
          <span class="group-hover:text-yellow-300 transition duration-300">Artists</span>
          <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-yellow-400 group-hover:w-full transition-all duration-300"></span>
        </a>
      </li>
      <li>
        <a href="contact.html" class="relative group">
          <span class="group-hover:text-yellow-300 transition duration-300">Contact</span>
          <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-yellow-400 group-hover:w-full transition-all duration-300"></span>
        </a>
      </li>
    </ul>
  </div>
</nav>

  <div class="bg-slate-800 min-h-screen flex flex-col items-center pt-20">
    
    <!-- Image Card -->
    <div class="w-[470px] h-[500px] bg-white/10 backdrop-blur p-3 mt-5 rounded-2xl shadow-2xl">
      <img id="cover-photo" class="w-full h-full object-cover rounded-xl" src="music1.jpg" alt="lover">
    </div>
    
    <!--Song Info -->
    <h1 id="singer" class="text-xl text-yellow-100 font-semibold mt-5">Taylor Swift</h1>
    <h1 id="title" class="text-2xl text-white mt-10 font-semibold">LOVER</h1>
    
    <!-- Duration Bar -->
    <div class="flex items-center gap-3 w-full max-w-xl mt-4">
      <span id="current-time" class="text-gray-300 text-sm">0:00</span>
      <div id="full-bar"class="relative w-full h-3 bg-gray-600 rounded">
        <div id="progress-bar" class="absolute top-0.5 left-0 h-2 rounded" style="width: 35% ;background-color: #EDBD00 "></div>
        <div id="progress-handle" class="absolute top-[-6px] left-[35%] w-6 h-6 rounded-full " style="background-color: #EDBD00"></div>
      </div>
      <span id="total-duration" class="text-gray-300 text-sm">0:00</span>
    </div>

    <!--Control Buttons -->
     <audio id="audio-player"></audio>
    <div class="flex items-center gap-24 w-full max-w-md mt-10">
        <div class="p-2 rounded-full shadow-2xl bg-white/10 backdrop-blur">
      <div id="prev" class="w-20 h-20 p-3 flex items-center justify-center rounded-full"style="background-color: #EDBD00">
        <img class="w-7 h-7 object-contain" src="rewind-button.png">
        </div>
      </div>
      <div class="p-2 rounded-full shadow-2xl bg-white/10 backdrop-blur">
      <div id="play" class="w-20 h-20 flex items-center justify-center rounded-full"style="background-color: #EDBD00">
        <img id="play-icon" class="w-7 h-7 object-contain" src="play-button.png">
      </div>
    </div>
    <div class="p-2 rounded-full shadow-2xl bg-white/10 backdrop-blur">
      <div id="next" class="w-20 h-20 flex items-center justify-center rounded-full"style="background-color: #EDBD00">
        <img class="w-7 h-7 object-contain" src="next.png">
      </div>
      </div>
    </div>

  </div>
</body>
</html>
