<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-800 text-white pt-32 min-h-screen flex items-center justify-center">

  <!-- Navbar -->
  <nav class="fixed top-0 w-full z-50 bg-white/10 backdrop-blur-md shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-yellow-400 to-yellow-500 animate-pulse">
        🎵 Music Vibes
      </a>
      <ul class="flex gap-8 text-white font-medium">
        <li><a href="index.html" class="hover:text-yellow-300 transition">Home</a></li>
        <li><a href="albums.html" class="hover:text-yellow-300 transition">Albums</a></li>
        <li><a href="artists.html" class="hover:text-yellow-300 transition">Artists</a></li>
        <li><a href="contact.html" class="hover:text-yellow-300 transition">Contact</a></li>
        <li><a href="login.html" class="hover:text-yellow-300 transition">Login</a></li>
      </ul>
    </div>
  </nav>

  <!-- Login Box -->
  <form onsubmit="event.preventDefault(); window.location.href='index.html';">

  <div class="bg-white/10 p-8 rounded-2xl backdrop-blur shadow-2xl w-full max-w-sm">
    <h2 class="text-3xl font-bold text-yellow-300 mb-6 text-center">Login to Music Vibes</h2>
    <form>
      <div class="mb-4">
        <label for="email" class="block text-sm text-gray-200 mb-1">Email</label>
        <input type="email" id="email" class="w-full p-2 rounded bg-gray-100 text-black" required>
      </div>
      <div class="mb-6">
        <label for="password" class="block text-sm text-gray-200 mb-1">Password</label>
        <input type="password" id="password" class="w-full p-2 rounded bg-gray-100 text-black" required>
      </div>
      <button type="submit" class="w-full bg-yellow-400 text-black font-bold py-2 rounded hover:bg-yellow-500 transition">
        Login
      </button>
      <p class="text-sm text-center mt-4 text-gray-300">
        Don't have an account? <a href="#" class="text-yellow-300 hover:underline">Register</a>
      </p>
    </form>
  </div>

</body>
</html>
